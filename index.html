<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Termux Web Terminal</title>
  
  <!-- Xterm.js CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="termux-window">
    <!-- แถบด้านบน: จำลองปุ่ม 3 ขีด, ชื่อ Tab และปุ่ม บวก/ลบ Tab -->
    <div class="termux-top-bar">
      <div class="left-controls">
        <button id="menu-btn" title="Menu">≡</button>
        <div id="tabs-container" class="tabs-container">
          <!-- Tabs จะถูกสร้างขึ้นมาตรงนี้ด้วย JavaScript -->
        </div>
      </div>
      <div class="right-controls">
        <button id="add-tab-btn" title="New Tab">+</button>
        <button id="close-tab-btn" title="Close Tab">-</button>
      </div>
    </div>

    <!-- พื้นที่แสดงผล Terminal ของ Xterm.js -->
    <div id="terminal"></div>

    <!-- แถบปุ่มลัดด้านล่างแบบ Termux (Extra Keys) -->
    <div class="termux-extra-keys">
      <button class="key-btn" data-key="ESC">ESC</button>
      <button class="key-btn" data-key="/">/</button>
      <button class="key-btn" data-key="-">-</button>
      <button class="key-btn" data-key="HOME">HOME</button>
      <button class="key-btn" data-key="UP">▲</button>
      <button class="key-btn" data-key="END">END</button>
      <button class="key-btn" data-key="PGUP">PGUP</button>
      <button class="key-btn" data-key="CTRL">CTRL</button>
      <button class="key-btn" data-key="ALT">ALT</button>
      <button class="key-btn" data-key="LEFT">◀</button>
      <button class="key-btn" data-key="DOWN">▼</button>
      <button class="key-btn" data-key="RIGHT">▶</button>
      <button class="key-btn" data-key="PGDN">PGDN</button>
    </div>
  </div>

  <!-- Xterm.js Core & Addon Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.8.0/lib/addon-fit.js"></script>
  <!-- Custom Application Script -->
  <script src="script.js"></script>
</body>
</html>
